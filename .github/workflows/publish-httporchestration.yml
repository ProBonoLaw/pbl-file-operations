name: Publish HttpOrchestration

on:
  pull_request:
    branches: [main]
    paths:
      - src/HttpOrchestration/**
      - tests/HttpOrchestration.Tests/**
      - .github/scripts/check-httporchestration-package.py
      - .github/workflows/publish-httporchestration.yml
      - LICENSE
      - NOTICE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: httporchestration-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test the library
        run: dotnet test tests/HttpOrchestration.Tests/HttpOrchestration.Tests.csproj --configuration Release
      - name: Pack and inspect the release
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          dotnet pack src/HttpOrchestration/HttpOrchestration.csproj \
            --configuration Release --output artifacts -p:ContinuousIntegrationBuild=true
          version=$(dotnet msbuild src/HttpOrchestration/HttpOrchestration.csproj -getProperty:Version)
          python3 .github/scripts/check-httporchestration-package.py \
            "artifacts/DaatPhoenix.HttpOrchestration.$version.nupkg" \
            --version "$version" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: httporchestration-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ProBonoLaw/pbl-file-operations' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: httporchestration-nuget
          path: artifacts
      - name: Publish to ProBonoLaw GitHub Packages
        env:
          NUGET_API_KEY: ${{ github.token }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/probonolaw/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Verify a fresh install from the published feed
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(find artifacts -maxdepth 1 -name '*.nupkg' -print -quit)
          version=${package#artifacts/DaatPhoenix.HttpOrchestration.}
          version=${version%.nupkg}
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          cat > "$verify_dir/NuGet.Config" <<'XML'
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github" value="https://nuget.pkg.github.com/probonolaw/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="github"><package pattern="DaatPhoenix.HttpOrchestration" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          XML
          dotnet new classlib --framework net10.0 --no-restore --output "$verify_dir/Consumer"
          dotnet add "$verify_dir/Consumer/Consumer.csproj" package DaatPhoenix.HttpOrchestration --version "$version" --no-restore
          dotnet restore "$verify_dir/Consumer/Consumer.csproj" --configfile "$verify_dir/NuGet.Config" \
            --packages "$verify_dir/packages" --no-http-cache
          cmp "$package" "$verify_dir/packages/daatphoenix.httporchestration/$version/daatphoenix.httporchestration.$version.nupkg"
          gh api 'orgs/probonolaw/packages?package_type=nuget' \
            --jq '.[] | select((.name | ascii_downcase) == "daatphoenix.httporchestration") | {name,visibility,html_url}'
